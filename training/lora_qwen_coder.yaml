# mlx_lm.lora — pass with:  mlx_lm.lora --train -c training/lora_qwen_coder.yaml
# CLI flags override YAML when both are set (mlx-lm merges CLI first, then fills from YAML).

model: mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit
train: true
data: data/lora/game_text

fine_tune_type: lora
optimizer: adamw
mask_prompt: false

num_layers: -1
# batch_size 1 is safer for small valid sets; bump to 2+ when you have hundreds of train lines.
batch_size: 1
iters: 400
val_batches: 8
learning_rate: 1.0e-5
steps_per_report: 10
steps_per_eval: 50
grad_accumulation_steps: 2

adapter_path: checkpoints/fe-lora-latest
save_every: 100

max_seq_length: 4096
grad_checkpoint: true
seed: 42

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer_config:
  adam: {}
  adamw: {}
  muon: {}
  sgd: {}
  adafactor: {}
